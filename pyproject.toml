[project]
name = "wh-research-pure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "lamweiheng54@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "altair>=6.3.0",
    "cryptohftdata>=0.8.0",
    "hyperliquid-python-sdk>=0.24.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tenacity>=9.2.1",
]

[project.scripts]
wh-research-pure = "wh_research_pure:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
